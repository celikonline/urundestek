name: sense-support
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: ${SUPPORT_ENV_FILE:-.env}
  environment: &backend-env
    APP_ENV: production
    DATABASE_URL: postgresql+psycopg://support:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gereklidir}@db:5432/support
    PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL gereklidir}
    COOKIE_SECURE: ${COOKIE_SECURE:-true}
    RUN_REMINDER_WORKER: "false"
  restart: unless-stopped
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: support
      POSTGRES_DB: support
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gereklidir}
    volumes: [support-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U support -d support"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    restart: "no"
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *backend
    command: [python, -m, app.worker]
    depends_on:
      api: {condition: service_healthy}
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:${SUPPORT_PORT:-8080}:80"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  support-db:
